# Dokumentasi API SQMS (OpenAPI 3.0). Diuji kesesuaiannya dengan rute oleh tests/Feature/OpenApiSpecTest.php.
openapi: 3.0.3
info:
  title: SQMS — Smart Queue Management System API
  version: 1.0.0
  description: 'API backend SQMS (Laravel, PostgreSQL). Semua endpoint berprefiks `/api/v1` kecuali `/broadcasting/auth`.


    **Autentikasi:** `Authorization: Bearer <token>` (Sanctum). Petugas/admin memperoleh token dari `/auth/login`; perangkat display dari `/display/activate`.
    Endpoint publik (katalog, pendaftaran, pelacakan) tidak memerlukan token.


    **Isolasi cabang:** setiap data operasional memiliki `branch_id`. Pengguna cabang hanya dapat mengakses cabangnya; Super Admin mengirim `branch_id`
    untuk endpoint per-cabang. Pembatasan dilakukan di backend (middleware, policy, query scope), bukan di frontend.


    **Format:** respons sukses `{ "data": ..., "message": "..." }`; daftar memakai pagination Laravel (`data`, `links`, `meta`). Galat: `{ "message":
    "..." }` atau `{ "message", "errors": { field: [pesan] } }` (422).


    **Masa berlaku token:** staf 12 jam (dapat diperpanjang lewat `/auth/refresh`), perangkat 7 hari.


    **Rate limit:** umum 120/menit; login 5/menit per email+IP; pendaftaran antrian 20/menit per IP; aktivasi display 10/menit per IP.


    **Real-time:** lihat operasi `POST /broadcasting/auth` (Reverb/Echo).'
servers:
- url: /api/v1
  description: Server saat ini
security:
- bearerAuth: []
tags:
- name: Auth
- name: Katalog Publik
- name: Antrian Publik
- name: Kiosk
- name: Antrian Staf
- name: Distribusi
- name: Ruang Kerja Petugas
- name: Cabang
- name: Petugas
- name: Loket
- name: Layanan
- name: Central Display
- name: Pengaturan
- name: Laporan
- name: Realtime
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: Login petugas/admin
      operationId: login
      description: 'Mengembalikan token Sanctum untuk header `Authorization: Bearer` beserta `expires_at` (default 12 jam, `SANCTUM_STAFF_TOKEN_MINUTES`).
        Akun petugas yang nonaktif/dihapus ditolak (403). Dibatasi 5 percobaan per menit per email+IP. Login berhasil, gagal, dan diblokir dicatat
        di audit log (tanpa menyimpan password).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: Login berhasil.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/LoginResult'
                  message:
                    type: string
        '401':
          description: Email atau password salah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /auth/me:
    get:
      tags:
      - Auth
      summary: Profil pengguna saat ini
      operationId: me
      description: Berisi role, daftar permission, dan cabang. Dipakai frontend untuk menu & route guard.
      responses:
        '200':
          description: Profil.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /auth/profile:
    put:
      tags:
      - Auth
      summary: Ubah nama profil
      operationId: updateProfile
      description: Hanya nama yang dapat diubah; email tidak dapat diganti. Perubahan tercatat di audit.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              properties:
                name:
                  type: string
                  maxLength: 150
      responses:
        '200':
          description: Profil terbaru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/password:
    put:
      tags:
      - Auth
      summary: Ganti password
      operationId: updatePassword
      description: Wajib menyertakan password saat ini. Password baru minimal 8 karakter dan harus dikonfirmasi.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - current_password
              - password
              - password_confirmation
              properties:
                current_password:
                  type: string
                password:
                  type: string
                  minLength: 8
                password_confirmation:
                  type: string
      responses:
        '200':
          description: Password diperbarui.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '422':
          $ref: '#/components/responses/ValidationError'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: Perpanjang token staf
      operationId: refreshToken
      description: Menukar token yang masih berlaku dengan token baru (masa berlaku dihitung ulang) dan mencabut token lama. Frontend memanggilnya
        otomatis selama tab terbuka. Token yang sudah kedaluwarsa tidak dapat diperpanjang (401); token perangkat ditolak (403).
      responses:
        '200':
          description: Token baru.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/TokenRefresh'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: Logout
      operationId: logout
      description: Menghapus token yang sedang dipakai.
      responses:
        '200':
          description: Logout berhasil.
        '401':
          $ref: '#/components/responses/Unauthenticated'
  /catalog/branches:
    get:
      tags:
      - Katalog Publik
      summary: Daftar cabang aktif + status pendaftaran
      operationId: catalogBranches
      description: 'Publik. Setiap cabang menyertakan `availability`: buka/tutup, jam operasional, sisa kuota online hari ini.'
      responses:
        '200':
          description: Daftar cabang.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicBranch'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /catalog/service-types:
    get:
      tags:
      - Katalog Publik
      summary: Layanan aktif suatu cabang
      operationId: catalogServiceTypes
      parameters:
      - name: branch_id
        in: query
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Daftar layanan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ServiceType'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /queues/online:
    post:
      tags:
      - Antrian Publik
      summary: Pendaftaran online
      operationId: registerOnline
      description: 'Nomor urut dibuat dengan transaksi + `SELECT FOR UPDATE` pada `queue_sequences` (per cabang, layanan, tanggal operasional)
        sehingga aman dari duplikasi walau banyak pendaftar bersamaan. Token pelacakan **hanya ditampilkan sekali**. Dibatasi 20 permintaan/menit
        per IP.


        Ditolak (422) bila cabang libur/tutup/di luar jam operasional, kuota online harian penuh, antrian menunggu melewati ambang, atau nomor
        telepon yang sama sudah punya antrian aktif untuk layanan itu. Prioritas hanya boleh diklaim oleh staf berwenang (`queues.assign`).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Antrian dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrationResult'
                  message:
                    type: string
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /queues/walk-in:
    post:
      tags:
      - Antrian Staf
      summary: Pendaftaran walk-in oleh staf
      operationId: registerWalkIn
      description: 'Nomor urut dibuat dengan transaksi + `SELECT FOR UPDATE` pada `queue_sequences` (per cabang, layanan, tanggal operasional)
        sehingga aman dari duplikasi walau banyak pendaftar bersamaan. Token pelacakan **hanya ditampilkan sekali**. Dibatasi 20 permintaan/menit
        per IP.


        **Wajib login.** Dahulu publik; sekarang dikunci agar jam operasional dan kuota online tidak dapat dilewati dari luar. Untuk tablet di
        kantor gunakan `POST /kiosk/queues`. Cabang harus milik pemanggil (Super Admin bebas). Tidak dibatasi jam operasional/kuota online. Kategori
        prioritas hanya diterima bila pemanggil punya `queues.assign`.


        **Izin:** ``queues.register` atau `queues.assign``.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrationInput'
      responses:
        '201':
          description: Antrian dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/RegistrationResult'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /kiosk/config:
    get:
      tags:
      - Kiosk
      summary: Konfigurasi kiosk
      operationId: kioskConfig
      description: Hanya token perangkat bertipe KIOSK. Layanan aktif cabang perangkat dan status operasional.
      responses:
        '200':
          description: Konfigurasi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KioskConfig'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
      security:
      - kioskAuth: []
  /kiosk/queues:
    post:
      tags:
      - Kiosk
      summary: Ambil nomor antrian dari kiosk
      operationId: kioskIssueTicket
      description: Cabang selalu diambil dari perangkat; `branch_id` dan `priority_type_id` pada input diabaikan (customer tidak dapat mengklaim
        prioritas). Layanan dari cabang lain ditolak 422. Dibatasi 30 permintaan/menit per perangkat. Token pelacakan hanya tampil sekali (untuk
        QR/tautan pada tiket).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KioskQueueInput'
      responses:
        '201':
          description: Tiket dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/KioskTicket'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - kioskAuth: []
  /queues/track/{token}:
    get:
      tags:
      - Antrian Publik
      summary: Lacak antrian dengan token
      operationId: trackQueue
      description: Posisi dihitung memakai skor prioritas+aging yang sama dengan mesin distribusi. `estimated_wait_seconds` bernilai `null` bila
        belum ada petugas aktif.
      parameters:
      - name: token
        in: path
        required: true
        schema:
          type: string
          minLength: 32
      responses:
        '200':
          description: Status antrian.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTracking'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /queues/cancel-by-token:
    post:
      tags:
      - Antrian Publik
      summary: Batalkan antrian dengan token
      operationId: cancelByToken
      description: Hanya untuk status WAITING/ASSIGNED/CALLED. Membebaskan petugas dan kuota online.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenCancelInput'
      responses:
        '200':
          description: Antrian dibatalkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueTracking'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security: []
  /queues/history:
    get:
      tags:
      - Antrian Staf
      summary: Riwayat/monitoring antrian
      operationId: queueHistory
      description: 'CS/Teller hanya melihat antrian layanan yang menjadi kompetensinya; supervisor/admin melihat seluruh cabangnya.


        **Izin:** `queues.view`.'
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/PerPage'
      - $ref: '#/components/parameters/BranchIdQuery'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/QueueStatus'
      - name: queue_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Daftar berhalaman.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Queue'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /queues/{queue}/cancel:
    post:
      tags:
      - Antrian Staf
      summary: Batalkan antrian (staf)
      operationId: cancelQueue
      description: '**Izin:** `queues.cancel`.'
      parameters:
      - name: queue
        in: path
        required: true
        description: ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  maxLength: 500
      responses:
        '200':
          description: Dibatalkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /queues/{queue}/verify-priority:
    post:
      tags:
      - Antrian Staf
      summary: Verifikasi prioritas
      operationId: verifyPriority
      description: 'Mencatat siapa yang memverifikasi prioritas (audit).


        **Izin:** `queues.assign`.'
      parameters:
      - name: queue
        in: path
        required: true
        description: ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PriorityVerifyInput'
      responses:
        '200':
          description: Prioritas diverifikasi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /queues/{queue}/transfer:
    post:
      tags:
      - Antrian Staf
      summary: Pindahkan antrian ke layanan lain
      operationId: transferQueue
      description: 'Antrian mendapat nomor baru di layanan tujuan dan kembali WAITING. Bila sedang dilayani, sesi layanan ditutup dengan outcome
        `TRANSFERRED`. Setelah transfer, distribusi otomatis langsung dijalankan sehingga antrian dan petugas yang dibebaskan segera mendapat
        pasangan.


        **Izin:** `queues.transfer`.'
      parameters:
      - name: queue
        in: path
        required: true
        description: ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransferInput'
      responses:
        '200':
          description: Dipindahkan.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /queues/{queue}/status:
    patch:
      tags:
      - Antrian Staf
      summary: Ubah status antrian (generik)
      operationId: changeQueueStatus
      description: 'Transisi divalidasi ketat: WAITING→CANCELLED; ASSIGNED→CALLED/WAITING/CANCELLED/SKIPPED/NO_SHOW; CALLED→SERVING/CALLED(recall)/SKIPPED/CANCELLED;
        SERVING→COMPLETED/SKIPPED/NO_SHOW. `ASSIGNED` hanya dibuat oleh mesin distribusi. Petugas non-supervisor hanya boleh memproses antrian
        yang dialokasikan kepadanya. Untuk alur harian petugas gunakan `/service/{queue}/{action}`.


        **Izin:** `sesuai status tujuan (`queues.call`, `queues.start`, `queues.complete`, `queues.skip`, `queues.cancel`, `queues.assign`)`.'
      parameters:
      - name: queue
        in: path
        required: true
        description: ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusInput'
      responses:
        '200':
          description: Status diubah.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Queue'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /queues/{queue}/assign:
    post:
      tags:
      - Distribusi
      summary: Assignment manual oleh supervisor
      operationId: manualAssign
      description: 'Wajib menyertakan alasan (tercatat). Petugas harus berkompetensi, tersedia, dan loket bebas.


        **Izin:** `queues.assign`.'
      parameters:
      - name: queue
        in: path
        required: true
        description: ID (UUID).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAssignInput'
      responses:
        '201':
          description: Assignment dibuat.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Assignment'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
  /supervisor/board:
    get:
      tags:
      - Distribusi
      summary: Papan supervisor
      operationId: supervisorBoard
      description: 'Satu permintaan untuk UI supervisor: antrian aktif hari ini (WAITING/ASSIGNED/CALLED/SERVING) beserta petugas & loket yang
        menanganinya, status seluruh petugas aktif (termasuk `is_available`, layanan, loket, antrian aktif), loket aktif (`in_use_by`), layanan,
        dan kategori prioritas. Dipakai untuk assign manual, transfer, dan verifikasi prioritas.


        **Izin:** `queues.assign`.'
      parameters:
      - $ref: '#/components/parameters/BranchIdQuery'
      responses:
        '200':
          description: Papan.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/SupervisorBoard'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /distribution/next:
    post:
      tags:
      - Distribusi
      summary: Jalankan distribusi otomatis (Round Robin)
      operationId: distributeNext
      description: 'Meng-assign satu antrian WAITING (prioritas+aging) ke satu petugas AVAILABLE berkompetensi dengan loket bebas. Mengembalikan
        `data: null` bila tidak ada kandidat.


        **Izin:** `queues.assign`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DistributionInput'
      responses:
        '200':
          description: Hasil distribusi.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    oneOf:
                    - $ref: '#/components/schemas/Assignment'
                    - type: 'null'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /employee/workspace:
    get:
      tags:
      - Ruang Kerja Petugas
      summary: Ringkasan ruang kerja petugas
      operationId: workspace
      description: 'Status petugas, antrian aktif (+ loket, waktu tunggu, durasi), antrian berikutnya.


        **Izin:** `queues.view`.'
      responses:
        '200':
          description: Workspace.
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Workspace'
                  message:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
  /employee/status:
    post:
      tags:
      - Ruang Kerja Petugas
      summary: Ubah status diri
      operationId: setOwnStatus
      description: 'Status `BUSY` hanya diatur sistem. Ditolak 409 bila petugas masih memiliki antrian aktif. Saat menjadi `AVAILABLE`, auto-assign
        dijalankan.


        **Izin:** `employees.status`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeStatusInput'
      responses:
        '200':
          description: Status diubah.
          content:
            application/json:
              schema:
