  /broadcasting/auth:
    post:
      summary: Otorisasi channel WebSocket privat
      operationId: broadcastAuth
      tags:
      - Realtime
      description: 'Dipakai Laravel Echo untuk `private-branch.{branchId}` dan `private-employee.{employeeId}`. Token staf hanya boleh masuk channel
        cabangnya; token perangkat TV (DISPLAY) hanya channel cabang perangkat itu dan tidak dapat masuk channel petugas; token KIOSK ditolak.
        Server Reverb juga memeriksa header `Origin` (lihat `REVERB_ALLOWED_ORIGINS`).


        Event: `queue.created`, `queue.assigned`, `queue.called`, `queue.recalled`, `queue.started`, `queue.completed`, `queue.transferred`, `queue.status-changed`,
        `employee.status-changed`, `display.updated`. Setiap event membawa `event_id` dan `occurred_at`; event dikirim hanya setelah transaksi
        database commit.'
      servers:
      - url: /
      security:
      - bearerAuth: []
      - displayAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - socket_id
              - channel_name
              properties:
                socket_id:
                  type: string
                channel_name:
                  type: string
                  example: private-branch.00000000-0000-0000-0000-000000000000
      responses:
        '200':
          description: Tanda tangan channel.
          content:
            application/json:
              schema:
                type: object
                properties:
                  auth:
                    type: string
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token Sanctum dari `POST /auth/login` (staf/admin).
    displayAuth:
      type: http
      scheme: bearer
      description: Token perangkat TV dari `POST /display/activate` (ability `display`, berlaku 7 hari). Hanya untuk `/display/snapshot`, `/display/refresh`,
        dan channel cabang perangkat itu.
    kioskAuth:
      type: http
      scheme: bearer
      description: Token perangkat kiosk dari `POST /display/activate` (ability `kiosk`, berlaku 7 hari). Hanya untuk `/kiosk/*` dan `/display/refresh`;
        tidak dapat masuk channel real-time.
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
    PerPage:
      name: per_page
      in: query
      description: Maksimum 100.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    Q:
      name: q
      in: query
      description: Pencarian teks (tidak peka huruf besar/kecil; karakter wildcard diperlakukan sebagai teks).
      schema:
        type: string
    IsActive:
      name: is_active
      in: query
      schema:
        type: boolean
    Deleted:
      name: deleted
      in: query
      description: '`1` = hanya data yang sudah dihapus (untuk dipulihkan).'
      schema:
        type: boolean
    Direction:
      name: direction
      in: query
      schema:
        type: string
        enum:
        - asc
        - desc
        default: asc
    BranchIdQuery:
      name: branch_id
      in: query
      description: Wajib untuk Super Admin pada endpoint per-cabang. Pengguna cabang hanya boleh cabangnya sendiri (cabang lain ditolak).
      schema:
        type: string
        format: uuid
  responses:
    Unauthenticated:
      description: Token tidak ada/tidak valid/kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Tidak punya izin atau data milik cabang lain.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Konflik status/penggunaan (mis. loket sedang melayani, transisi status tidak diizinkan).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    ValidationError:
      description: Validasi gagal.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
    TooManyRequests:
      description: Rate limit terlampaui.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        message:
          type: string
    ValidationError:
      type: object
      properties:
        message:
          type: string
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
    PaginationLinks:
      type: object
      properties:
        first:
          type: string
          nullable: true
        last:
          type: string
          nullable: true
        prev:
          type: string
          nullable: true
        next:
          type: string
          nullable: true
    PaginationMeta:
      type: object
      properties:
        current_page:
          type: integer
        last_page:
          type: integer
        per_page:
          type: integer
        total:
          type: integer
        from:
          type: integer
          nullable: true
        to:
          type: integer
          nullable: true
    QueueStatus:
      type: string
      enum:
      - WAITING
      - ASSIGNED
      - CALLED
      - SERVING
      - COMPLETED
      - SKIPPED
      - CANCELLED
      - NO_SHOW
    EmployeeStatus:
      type: string
      enum:
      - AVAILABLE
      - BUSY
      - BREAK
      - OFFLINE
      - CLOSED
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        email:
          type: string
        branch_id:
          type: string
          format: uuid
          nullable: true
        branch:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            branch_code:
              type: string
            branch_name:
              type: string
        roles:
          type: array
          items:
            type: string
        permissions:
          type: array
          items:
            type: string
        employee:
          type: object
          nullable: true
        last_login_at:
          type: string
          format: date-time
          nullable: true
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
        device_name:
          type: string
          maxLength: 100
      required:
      - email
      - password
    LoginResult:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
          description: Kedaluwarsa token (ISO 8601).
    TokenRefresh:
      type: object
      properties:
        token:
          type: string
        expires_at:
          type: string
          format: date-time
          nullable: true
    SupervisorBoard:
      type: object
      properties:
        server_time:
          type: string
          format: date-time
          nullable: true
        queues:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              queue_number:
                type: string
              customer_name:
                type: string
              service_type_id:
                type: string
                format: uuid
              service_name:
                type: string
                nullable: true
              priority:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  name:
                    type: string
              priority_verified:
                type: boolean
              status:
                $ref: '#/components/schemas/QueueStatus'
              registration_channel:
                type: string
              registered_at:
                type: string
                format: date-time
                nullable: true
              called_at:
                type: string
                format: date-time
                nullable: true
              employee:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
              counter:
                type: object
                nullable: true
                properties:
                  id:
                    type: string
                    format: uuid
                  code:
                    type: string
                  name:
                    type: string
        employees:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              employee_code:
                type: string
              employee_name:
                type: string
              status:
                $ref: '#/components/schemas/EmployeeStatus'
              is_available:
                type: boolean
              service_type_ids:
                type: array
                items:
                  type: string
                  format: uuid
              counter_ids:
                type: array
                items:
                  type: string
                  format: uuid
              active_queue_number:
                type: string
                nullable: true
        counters:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              counter_code:
                type: string
              counter_name:
                type: string
              counter_type:
                type: string
              in_use_by:
                type: string
                nullable: true
                description: Nama petugas yang sedang memakai loket.
        services:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              service_name:
                type: string
              queue_prefix:
                type: string
        priorities:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                format: uuid
              priority_code:
                type: string
              priority_name:
                type: string
              weight:
                type: integer
    Branch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch_code:
          type: string
        branch_name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        is_active:
          type: boolean
        employees_count:
          type: integer
        counters_count:
          type: integer
        service_types_count:
          type: integer
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        deleted_at:
          type: string
          format: date-time
          nullable: true
    BranchInput:
      type: object
      properties:
        branch_code:
          type: string
          maxLength: 30
          description: Huruf/angka/-/_; unik (termasuk cabang terhapus).
        branch_name:
          type: string
          maxLength: 150
        address:
          type: string
          maxLength: 500
          nullable: true
        phone:
          type: string
          maxLength: 40
          nullable: true
        is_active:
          type: boolean
      required:
      - branch_code
      - branch_name
    PublicBranch:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch_code:
          type: string
        branch_name:
          type: string
        address:
          type: string
          nullable: true
        phone:
          type: string
          nullable: true
        availability:
          $ref: '#/components/schemas/Availability'
    Availability:
      type: object
      properties:
        is_open:
          type: boolean
        reason:
          type: string
          nullable: true
        message:
          type: string
          nullable: true
        opens_at:
          type: string
          nullable: true
          example: 08:00
        closes_at:
          type: string
          nullable: true
          example: '16:00'
        holiday_name:
          type: string
          nullable: true
