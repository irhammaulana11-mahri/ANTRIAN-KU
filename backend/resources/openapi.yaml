        online_message:
          type: string
          nullable: true
        online_quota:
          type: object
          properties:
            limit:
              type: integer
              nullable: true
            used:
              type: integer
            remaining:
              type: integer
              nullable: true
        waiting_count:
          type: integer
    Employee:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
          nullable: true
        employee_code:
          type: string
        employee_name:
          type: string
        is_active:
          type: boolean
        user:
          type: object
          properties:
            id:
              type: string
              format: uuid
            name:
              type: string
            email:
              type: string
            roles:
              type: array
              items:
                type: string
        service_types:
          type: array
          items:
