server {
    listen 80;
    listen [::]:80;
    server_name antrian-ku.bolinggo.com;
    root /var/www/ANTRIAN-KU/frontend/dist;
    index index.html;
    client_max_body_size 10m;

    # SPA: CSP ketat. Tidak dipasang di /api/ karena Laravel mengirim CSP-nya sendiri (JSON: deny-all; /api/docs: nonce).
    # `add_header` dalam location menggantikan header tingkat server, jadi seluruh header keamanan diulang di sini.
    # connect-src: WebSocket Reverb diproksikan lewat /app/ pada host yang sama, sehingga cukup ws(s)://$http_host.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob:; connect-src 'self' ws://$http_host wss://$http_host; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Aktifkan setelah TLS terpasang (certbot): add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }
    # Halaman TV (/display) memutar video IPTV/YouTube yang diatur admin: butuh frame YouTube serta media & koneksi ke host stream
    # (HLS memuat segmen lewat XHR/fetch dan memakai MediaSource/blob:). Pelonggaran ini hanya berlaku untuk rute ini; halaman lain tetap ketat.
    # Halaman ini hanya membaca data dengan token perangkat terbatas, tanpa input pengguna.
    location ~ ^/display/?$ {
        try_files /index.html =404;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; media-src 'self' data: blob: http: https:; connect-src 'self' ws://$http_host wss://$http_host http: https:; frame-src https://www.youtube-nocookie.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
    location ^~ /api/ { root /var/www/ANTRIAN-KU/backend/public; try_files $uri /index.php?$query_string; }
    location = /broadcasting/auth { root /var/www/ANTRIAN-KU/backend/public; try_files $uri /index.php?$query_string; }
    location = /index.php {
        root /var/www/ANTRIAN-KU/backend/public;
        include snippets/fastcgi-php.conf;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/ANTRIAN-KU/backend/public/index.php;
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
    }
    location /app/ {
        proxy_pass http://127.0.0.1:8080/app/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
    location ~ /\. { deny all; }
}
