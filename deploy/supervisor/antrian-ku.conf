; Supervisor ANTRIAN-KU: queue worker dan Reverb (WebSocket) dikelola di sini saja.
; Jangan menjalankan Reverb lewat systemd bersamaan: keduanya memakai port 8080 dan saling bentrok (EADDRINUSE).
; Sesuaikan jalur PHP (/usr/bin/php8.5) dan QUEUE_CONNECTION di backend/.env (di server saat ini: database).

[program:antrian-ku-reverb]
process_name=%(program_name)s
command=/usr/bin/php8.5 /var/www/ANTRIAN-KU/backend/artisan reverb:start --host=127.0.0.1 --port=8080
directory=/var/www/ANTRIAN-KU/backend
autostart=true
autorestart=true
startsecs=5
startretries=3
stopasgroup=true
killasgroup=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/antrian-reverb.log
stopwaitsecs=30

[program:antrian-ku-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.5 /var/www/ANTRIAN-KU/backend/artisan queue:work database --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/ANTRIAN-KU/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/antrian-worker.log
stopwaitsecs=3600
