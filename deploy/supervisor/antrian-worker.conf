[program:sqms-worker]
process_name=%(program_name)s_%(process_num)02d
command=/usr/bin/php8.5 /var/www/ANTRIAN-KU/backend/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/ANTRIAN-KU/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/antrian-worker.log
stopwaitsecs=3600
