[program:sqms-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/sqms/backend/artisan queue:work redis --sleep=3 --tries=3 --timeout=90 --max-time=3600
directory=/var/www/sqms/backend
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/sqms-worker.log
stopwaitsecs=3600
